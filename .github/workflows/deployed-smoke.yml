name: deployed-smoke

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: deployed-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for fixed Aliyun and static-test deployment
        env:
          PRODUCTION_DATA_ACCESS_TOKEN: ${{ secrets.PRODUCTION_DATA_ACCESS_TOKEN }}
          TARGET_URL: ${{ github.ref_name == 'main' && 'https://deshan-tiyes.cn' || 'https://test.deshan-tiyes.cn' }}
          API_URL: ${{ github.ref_name == 'main' && 'https://deshan-tiyes.cn' || 'https://api-test.deshan-tiyes.cn' }}
          EXPECT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          ALLOWED_BROWSER_ORIGIN: https://test.deshan-tiyes.cn
        run: |
          EXTRA_ARGS=()
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            EXTRA_ARGS+=(--forbid-server-env-dev)
            ALLOWED_BROWSER_ORIGIN=""
          fi
          for attempt in $(seq 1 30); do
            if node scripts/check-deployed-smoke.mjs \
              --url "$TARGET_URL" \
              --api-url "$API_URL" \
              --commit "$GITHUB_SHA" \
              --expect-environment "$EXPECT_ENVIRONMENT" \
              --allowed-browser-origin "$ALLOWED_BROWSER_ORIGIN" \
              --require-platform "aliyun,dingtalk" \
              "${EXTRA_ARGS[@]}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
