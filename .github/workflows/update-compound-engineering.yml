name: update-compound-engineering

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-compound-engineering
  cancel-in-progress: false

jobs:
  propose-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: 读取最新正式 Compound Engineering release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/EveryInc/compound-engineering-plugin/releases/latest > "$RUNNER_TEMP/compound-engineering-release.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";

          const release = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/compound-engineering-release.json", "utf8"));
          if (release.draft || release.prerelease) throw new Error("latest release 不能是 draft 或 prerelease");
          if (!/^compound-engineering-v\d+\.\d+\.\d+$/.test(release.tag_name ?? "")) {
            throw new Error("release tag 未通过固定格式校验");
          }
          console.log(`tag=${release.tag_name}`);
          NODE

      - name: 检出 release tag 并解析实际 commit
        id: upstream
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          UPSTREAM_DIR="$(mktemp -d "$RUNNER_TEMP/compound-engineering.XXXXXX")"
          echo "path=$UPSTREAM_DIR" >> "$GITHUB_OUTPUT"
          git clone --no-checkout https://github.com/EveryInc/compound-engineering-plugin.git "$UPSTREAM_DIR"
          git -C "$UPSTREAM_DIR" checkout --detach "refs/tags/$TAG"
          COMMIT="$(git -C "$UPSTREAM_DIR" rev-parse HEAD)"
          COMMIT="$COMMIT" node --input-type=module <<'NODE'
          if (!/^[0-9a-f]{40}$/.test(process.env.COMMIT ?? "")) {
            throw new Error("release commit 必须是完整 SHA");
          }
          NODE
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: 比较固定版本并拒绝 tag 漂移
        id: decision
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          import { decideCompoundEngineeringRelease } from "./scripts/sync-compound-engineering-skills.mjs";

          const manifest = JSON.parse(readFileSync(".agents/skills/compound-engineering-upstream.json", "utf8"));
          const decision = decideCompoundEngineeringRelease({
            latestTag: process.env.TAG,
            latestCommit: process.env.COMMIT,
            currentTag: manifest.tag,
            currentCommit: manifest.commit
          });
          console.log(`needed=${decision.needed}`);
          NODE

      - name: 构建并发布机械候选分支
        if: steps.decision.outputs.needed == 'true'
        id: candidate
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          UPSTREAM_DIR: ${{ steps.upstream.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin dev
          BRANCH="codex/update-compound-engineering-${TAG#compound-engineering-v}"
          git checkout -B "$BRANCH" origin/dev
          node scripts/sync-compound-engineering-skills.mjs --source "$UPSTREAM_DIR" --tag "$TAG" --commit "$COMMIT"
          TAG="$TAG" COMMIT="$COMMIT" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const adrPath = "docs/decisions/2026-08-08-compound-engineering-skills.md";
          const manifest = JSON.parse(readFileSync(".agents/skills/compound-engineering-upstream.json", "utf8"));
          const currentPin = /^- 当前固定版本：compound-engineering-v\d+\.\d+\.\d+（commit [0-9a-f]{40}；内容 SHA-256 `[0-9a-f]{64}`）。$/m;
          const adr = readFileSync(adrPath, "utf8");
          if (!currentPin.test(adr)) throw new Error("ADR 缺少当前固定版本记录，拒绝升级");
          if (manifest.tag !== process.env.TAG || manifest.commit !== process.env.COMMIT || !/^[0-9a-f]{64}$/.test(manifest.contentSha256 ?? "")) {
            throw new Error("同步后的清单 pin 或内容摘要不合法，拒绝升级");
          }
          writeFileSync(adrPath, adr.replace(currentPin, `- 当前固定版本：${manifest.tag}（commit ${manifest.commit}；内容 SHA-256 \`${manifest.contentSha256}\`）。`));
          NODE
          git diff --check
          if git diff --quiet; then
            echo "::error::正式 release 高于固定版本但未产生候选差异。"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/compound-engineering-upstream.json .agents/skills/ce-compound .agents/skills/ce-compound-refresh .agents/skills/compound-engineering-LICENSE docs/decisions/2026-08-08-compound-engineering-skills.md
          git commit -m "chore: update Compound Engineering Skills to $TAG"

          cat > "$RUNNER_TEMP/compound-engineering-pr-body.md" <<'EOF'
          自动发现 EveryInc 最新正式 Compound Engineering release，并以固定 tag、完整 commit 与内容摘要同步两个允许的仓库内开发 Skill。高权限 updater 只做机械复制、校验、提交和质量工作流调度，绝不执行 vendored 文件；合并前仍需人工审查 Skill、脚本和许可证差异。

          Integration-Impact: none
          Integration-Impact-Reason: 只更新仓库内开发 Skill，不触及 provider runtime、环境绑定或外部平台
          Rule-Writeback: docs/decisions/2026-08-08-compound-engineering-skills.md
          Rule-Writeback-Reason: 更新当前固定版本记录、内容摘要和受控升级质量门
          EOF
          npm run check:pr -- --base origin/dev --body-file "$RUNNER_TEMP/compound-engineering-pr-body.md"

          LOCAL_SHA="$(git rev-parse HEAD)"
          LOCAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          OPEN_PR=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            REMOTE_SHA="$(git rev-parse "refs/remotes/origin/$BRANCH")"
            REMOTE_TREE="$(git rev-parse "${REMOTE_SHA}^{tree}")"
            if [ "$REMOTE_TREE" != "$LOCAL_TREE" ]; then
              echo "::error::同名远端分支与重建候选 tree 不一致，拒绝覆盖。"
              exit 1
            fi
            echo "复用 tree 完全一致的远端分支：$BRANCH"
            CANDIDATE_SHA="$REMOTE_SHA"
            if [ "$(gh pr list --base dev --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
              OPEN_PR=true
              echo "已有 tree 一致的开放升级 PR，不重复创建。"
            fi
          else
            git push --set-upstream origin "$BRANCH"
            CANDIDATE_SHA="$LOCAL_SHA"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "open_pr=$OPEN_PR" >> "$GITHUB_OUTPUT"

      - name: 显式调度只读 quality 并等待候选 SHA 通过
        if: steps.decision.outputs.needed == 'true' && steps.candidate.outputs.open_pr != 'true'
        env:
          BRANCH: ${{ steps.candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE_RUN_ID="$(gh run list --workflow quality.yml --event workflow_dispatch --branch "$BRANCH" --commit "$CANDIDATE_SHA" --limit 100 --json databaseId --jq 'map(.databaseId) | max // 0')"
          gh workflow run quality.yml --ref "$BRANCH" --raw-field candidate_sha="$CANDIDATE_SHA"
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow quality.yml --event workflow_dispatch --branch "$BRANCH" --commit "$CANDIDATE_SHA" --limit 100 --json databaseId --jq "map(select(.databaseId > $BEFORE_RUN_ID)) | max_by(.databaseId).databaseId // empty")"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::未找到候选 SHA 的显式 quality run。"
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

      - name: 创建面向 dev 的升级 PR
        if: steps.decision.outputs.needed == 'true' && steps.candidate.outputs.open_pr != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore: update Compound Engineering Skills to $TAG" \
            --body-file "$RUNNER_TEMP/compound-engineering-pr-body.md"
