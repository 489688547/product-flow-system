name: quality

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit that must be checked
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node --input-type=module <<'NODE'
          if (!/^[0-9a-f]{40}$/.test(process.env.CANDIDATE_SHA ?? "")) {
            throw new Error("candidate_sha 必须是完整 commit SHA");
          }
          if (process.env.GITHUB_SHA !== process.env.CANDIDATE_SHA) {
            throw new Error(`quality checkout ${process.env.GITHUB_SHA} 与候选 ${process.env.CANDIDATE_SHA} 不一致`);
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: github.event_name == 'pull_request'
        run: node scripts/check-pr-branch-flow.mjs
      - run: npm run check:branch-base
        env:
          GITHUB_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.base_ref }}
      - run: npm ci
      - run: node --test tests/compound-engineering-skills.test.mjs
      - run: npm run audit:dependencies
      - run: npm run lint
      - run: npm run check:governance
      - run: npm run check:integrations
      - run: npm run check:environment-capabilities
      - run: npm test
      - run: npm run build
      - run: node --test tests/static-test-build.test.mjs tests/workerd-runtime-compat.test.mjs
