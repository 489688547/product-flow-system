name: quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: github.event_name == 'pull_request'
        run: node scripts/check-pr-branch-flow.mjs
      - run: npm run check:branch-base
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint
      - run: npm run check:governance
      - run: npm run check:integrations
      - run: npm run check:environment-capabilities
      - run: npm test
      - run: npm run build
      - run: node --test tests/static-test-build.test.mjs tests/workerd-runtime-compat.test.mjs
