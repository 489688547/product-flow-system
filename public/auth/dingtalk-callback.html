<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>正在完成登录</title>
    <style>
      :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #172033; }
      main { width: min(360px, calc(100vw - 40px)); text-align: center; }
      .mark { width: 44px; height: 44px; margin: 0 auto 20px; border: 3px solid #d8e5ff; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
      h1 { margin: 0 0 10px; font-size: 20px; }
      p { min-height: 48px; margin: 0; color: #5d677a; font-size: 14px; line-height: 1.7; }
      button { margin-top: 16px; border: 0; border-radius: 8px; padding: 10px 18px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #93b4ff; outline-offset: 3px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>正在完成登录</h1>
      <p data-oauth-status role="status" aria-live="polite">正在校验企业身份…</p>
      <button data-oauth-retry type="button" hidden>重新尝试</button>
    </main>
    <script type="module">
      import { runDingTalkOAuthCallback } from "/auth/dingtalk-oauth.js";
      const run = () => runDingTalkOAuthCallback();
      document.querySelector("[data-oauth-retry]").addEventListener("click", run);
      run();
    </script>
  </body>
</html>
