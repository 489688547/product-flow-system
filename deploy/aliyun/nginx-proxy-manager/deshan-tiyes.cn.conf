# Production host. TLS termination and certificate renewal are managed by
# Nginx Proxy Manager; this upstream stays on the private Docker network.

server {
  set $forward_scheme http;
  set $server "product-flow-app";
  set $port 8080;

  listen 80;
  listen [::]:80;

  server_name deshan-tiyes.cn www.deshan-tiyes.cn;

  access_log /data/logs/product-flow_http_access.log proxy;
  error_log /data/logs/product-flow_http_error.log warn;

  location / {
    proxy_read_timeout 1800;
    proxy_connect_timeout 30;
    proxy_send_timeout 1800;

    include conf.d/include/proxy.conf;
    proxy_hide_header X-Server-Env;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}

server {
  set $forward_scheme http;
  set $server "product-flow-app";
  set $port 8080;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name deshan-tiyes.cn www.deshan-tiyes.cn;

  ssl_certificate /etc/letsencrypt/live/deshan-tiyes.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/deshan-tiyes.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:product_flow_ssl:10m;
  ssl_session_timeout 10m;

  access_log /data/logs/product-flow_https_access.log proxy;
  error_log /data/logs/product-flow_https_error.log warn;

  location / {
    proxy_read_timeout 1800;
    proxy_connect_timeout 30;
    proxy_send_timeout 1800;

    include conf.d/include/proxy.conf;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header X-Server-Env;
    proxy_redirect ~^https://login[.]dingtalk[.]com/oauth2/auth[?]redirect_uri=http%3A%2F%2Fdeshan-tiyes[.]cn(.*)$ https://login.dingtalk.com/oauth2/auth?redirect_uri=https%3A%2F%2Fdeshan-tiyes.cn$1;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
