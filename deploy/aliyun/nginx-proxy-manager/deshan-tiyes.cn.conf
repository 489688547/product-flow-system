# Production host. TLS termination and certificate renewal are managed by
# Nginx Proxy Manager; this upstream stays on the private Docker network.

server {
  set $forward_scheme http;
  set $server "product-flow-app";
  set $port 8080;

  listen 80;
  listen [::]:80;

  server_name deshan-tiyes.cn www.deshan-tiyes.cn;

  access_log /data/logs/product-flow_http_access.log proxy;
  error_log /data/logs/product-flow_http_error.log warn;

  location / {
    proxy_read_timeout 1800;
    proxy_connect_timeout 30;
    proxy_send_timeout 1800;

    include conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
