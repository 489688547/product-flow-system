# Test API host. It never proxies to the production container.
server {
  set $forward_scheme http;
  set $server "product-flow-test-api";
  set $port 8081;

  listen 80;
  listen [::]:80;

  server_name api-test.deshan-tiyes.cn;

  access_log /data/logs/product-flow_test_api_access.log proxy;
  error_log /data/logs/product-flow_test_api_error.log warn;

  location / {
    proxy_read_timeout 1800;
    proxy_connect_timeout 30;
    proxy_send_timeout 1800;

    include conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
