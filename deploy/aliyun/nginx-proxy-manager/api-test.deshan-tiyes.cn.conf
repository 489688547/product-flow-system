# Test API host. It never proxies to the production container.
server {
  listen 80;
  listen [::]:80;

  server_name api-test.deshan-tiyes.cn;

  include conf.d/include/letsencrypt-acme-challenge.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  set $forward_scheme http;
  set $server "product-flow-test-api";
  set $port 8081;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name api-test.deshan-tiyes.cn;

  ssl_certificate /etc/letsencrypt/live/api-test.deshan-tiyes.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api-test.deshan-tiyes.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:product_flow_test_api_ssl:10m;
  ssl_session_timeout 10m;

  access_log /data/logs/product-flow_test_api_access.log proxy;
  error_log /data/logs/product-flow_test_api_error.log warn;

  location / {
    proxy_read_timeout 1800;
    proxy_connect_timeout 30;
    proxy_send_timeout 1800;

    include conf.d/include/proxy.conf;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
