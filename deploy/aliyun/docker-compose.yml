services:
  product-flow-app:
    image: product-flow-system:aliyun
    build:
      context: ../..
      dockerfile: Dockerfile.aliyun
      args:
        PFS_BUILD_COMMIT: "${PFS_BUILD_COMMIT:-}"
    container_name: product-flow-app
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 1.5
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - "${PFS_RUNTIME_ENV_FILE:-/opt/product-flow/config/runtime.env}"
    environment:
      LOCAL_ONLINE_ACCOUNT_MODE: "0"
      PFS_RUNTIME_NAME: "production"
      PFS_RUNTIME_HOST: "0.0.0.0"
      PFS_RUNTIME_PORT: "8080"
      PFS_WRANGLER_PERSIST_DIR: "/var/lib/product-flow/wrangler"
      PFS_RUNTIME_ENV_FILE: "/run/pfs/runtime.env"
      PFS_PUBLIC_API_ORIGIN: "https://deshan-tiyes.cn"
      PFS_PUBLIC_APP_ORIGIN: "https://deshan-tiyes.cn"
    volumes:
      - "${PFS_DATA_DIR:-/opt/product-flow/data}:/var/lib/product-flow"
      - "${PFS_RUNTIME_ENV_FILE:-/opt/product-flow/config/runtime.env}:/run/pfs/runtime.env:ro"
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - proxy

  product-flow-test-api:
    profiles: ["test"]
    image: "${PFS_TEST_IMAGE:-product-flow-system:aliyun-test}"
    build:
      context: ../..
      dockerfile: Dockerfile.aliyun
      args:
        PFS_BUILD_COMMIT: "${PFS_BUILD_COMMIT:-}"
    container_name: product-flow-test-api
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 0.5
    mem_limit: 512m
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - "${PFS_TEST_RUNTIME_ENV_FILE:-/opt/product-flow-test/config/runtime.env}"
    environment:
      LOCAL_ONLINE_ACCOUNT_MODE: "0"
      PFS_RUNTIME_NAME: "test"
      PFS_RUNTIME_HOST: "0.0.0.0"
      PFS_RUNTIME_PORT: "8081"
      PFS_WRANGLER_PERSIST_DIR: "/var/lib/product-flow-test/wrangler"
      PFS_RUNTIME_ENV_FILE: "/run/pfs/runtime.env"
      PFS_PUBLIC_API_ORIGIN: "https://api-test.deshan-tiyes.cn"
      PFS_PUBLIC_APP_ORIGIN: "https://test.deshan-tiyes.cn"
      PFS_ALLOWED_BROWSER_ORIGIN: "https://test.deshan-tiyes.cn"
    volumes:
      - "${PFS_TEST_DATA_DIR:-/opt/product-flow-test/data}:/var/lib/product-flow-test"
      - "${PFS_TEST_RUNTIME_ENV_FILE:-/opt/product-flow-test/config/runtime.env}:/run/pfs/runtime.env:ro"
    tmpfs:
      - /tmp:size=96m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: "${PFS_PROXY_NETWORK:-nginx-proxy-manage_default}"
