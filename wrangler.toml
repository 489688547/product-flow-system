name = "product-flow-system-local-sandbox"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-18"

# Local sandbox only. Cloudflare account, remote D1 IDs and remote execution are forbidden.
[vars]
LOCAL_ONLINE_ACCOUNT_MODE = "0"
RUNTIME_ENV = "development"

[[d1_databases]]
binding = "PRODUCT_FLOW_DB"
database_name = "product-flow-system-local"
database_id = "PRODUCT_FLOW_DB"
remote = false

[[d1_databases]]
binding = "DEMO_FLOW_DB"
database_name = "product-flow-system-display-local"
database_id = "DEMO_FLOW_DB"
remote = false
